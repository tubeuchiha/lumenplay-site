<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>激活请在 App 内完成 · LumenPlay</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#e8b93c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
         line-height:1.8; display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px; }
  .card { max-width:520px; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:32px 28px; }
  h1 { font-size:22px; margin-bottom:12px; }
  p { color:var(--muted); font-size:15px; margin-bottom:12px; }
  ol { margin:0 0 16px 20px; color:var(--text); font-size:15px; }
  li { margin-bottom:6px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="card">
  <h1>激活已改为在 App 内完成</h1>
  <p>不需要网页，不需要订单号，也不需要复制或粘贴任何号码。</p>
  <ol>
    <li>在<strong>已经解锁</strong>的手机或平板上打开 LumenPlay；</li>
    <li>进入「播放设置 → 付费功能」，点「扫码激活其他设备」；</li>
    <li>扫一下要激活的设备屏幕上显示的二维码，几秒后那台设备自动解锁。</li>
  </ol>
  <p>在<strong>要激活的这台设备</strong>上，解锁窗口里也会显示二维码和数字短码，照着上一步扫即可。</p>
  <p><a href="index.html">返回 LumenPlay 官网</a> · 需要帮助：<a href="mailto:support@lumenplay.app">support@lumenplay.app</a></p>
</div>
</body>
</html>
